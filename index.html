<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Misión Supermercado v4.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Roboto:wght@400;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #1a1a1d;
            --color-surface: #2c2c34;
            --color-surface-light: #4e4e50;
            --color-text: #e0e0e0;
            --color-primary: #00f6ff;
            --color-primary-dark: #00d1d9;
            --color-error: #ff00a0;
            --color-danger: #d90087;
            --color-disabled-bg: #3a3a40;
            --color-disabled-text: #777;
            /* MEJORA: Añadir Noto Color Emoji como fallback en todas las fuentes */
            --font-main: 'Share Tech Mono', "Noto Color Emoji", monospace;
            --font-system: 'Roboto', "Noto Color Emoji", system-ui, sans-serif;
            --border-radius-main: 12px;
            --glow-main: 0 0 10px rgba(0, 246, 255, 0.15);
            --glow-main-hover: 0 0 15px rgba(0, 246, 255, 0.3);
            --transition-speed: 0.35s;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { 
            width: 100vw; height: 100vh; overflow: hidden; 
            font-family: var(--font-main); 
            color: var(--color-text);
            background-color: var(--color-bg);
            background-image: radial-gradient(circle at center, rgba(44, 44, 52, 0.5) 0%, transparent 70%),
                              linear-gradient(rgba(0, 246, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to right, rgba(0, 246, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
        }
        #app-container { position: relative; width: 100%; height: 100%; }

        @keyframes pop-in { 0% { opacity: 0; transform: scale(0.7); } 80% { opacity: 1; transform: scale(1.1); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes flash-confirm { 0% { box-shadow: 0 0 15px 5px rgba(0, 246, 255, 0.4); } 100% { box-shadow: none; } }
        @keyframes heart-beat { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
        @keyframes scanline-anim { 0% { transform: translateY(0%); } 100% { transform: translateY(-50%); } }
        @keyframes flash-error-bg { 0%, 100% { background-color: var(--color-surface); } 50% { background-color: var(--color-danger); } }
        
        .pop-in { animation: pop-in 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        .flash-animation { animation: flash-confirm 0.4s ease-out; }
        .key-flash { animation: flash-confirm 0.2s ease-out; }
        .answer-error-flash { animation: flash-error-bg 0.4s ease-in-out; }

        .screen { display: none; flex-direction: column; width: 100%; height: 100%; align-items: center; justify-content: center; opacity: 0; transform: scale(0.98); transition: opacity var(--transition-speed) ease-in-out, transform var(--transition-speed) ease-in-out; }
        .screen.active { display: flex; opacity: 1; transform: scale(1); }
        .screen-content-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 700px; gap: 25px; padding: 20px; }
        
        #title-screen-wrapper { justify-content: space-between; padding-bottom: 10vh; height: 100%; }

        .title { font-size: clamp(2.2rem, 8vw, 4rem); font-weight: 700; text-align: center; color: var(--color-primary); text-shadow: 0 0 10px rgba(0, 246, 255, 0.3); min-height: 1.2em; }
        .subtitle { font-size: clamp(1.2rem, 4vw, 1.8rem); text-align: center; color: #aaa; min-height: 1.2em; }
        .typing-cursor::after { content: '▋'; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .btn { padding: 15px 30px; font-size: clamp(1.1rem, 4vw, 1.5rem); font-weight: 600; color: var(--color-bg); background-color: var(--color-primary); border: none; cursor: pointer; transition: all 0.2s ease-out; min-width: clamp(220px, 50vw, 300px); box-shadow: var(--glow-main); border-radius: 0; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
        .btn:hover { background-color: var(--color-primary-dark); box-shadow: var(--glow-main-hover); transform: translateY(-2px); }
        .btn-icon { background: none; border: none; cursor: pointer; padding: 10px; min-width: auto; box-shadow: none; }
        .btn-icon svg { width: 32px; height: 32px; fill: #aaa; transition: fill 0.2s; }
        .btn-icon:hover svg { fill: var(--color-primary); }
        
        #scanline-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 200%; pointer-events: none; z-index: 9999; background: repeating-linear-gradient(to bottom, rgba(0, 246, 255, 0.03), rgba(0, 246, 255, 0.03) 1px, transparent 1px, transparent 4px); animation: scanline-anim 20s linear infinite; }
        
        .display-panel { width: 100%; border: 1px solid var(--color-primary-dark); padding: 20px; background: linear-gradient(145deg, var(--color-surface), #212128); border-radius: 0; clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); }
        
        #screen-level-select .screen-content-wrapper { justify-content: center; gap: 35px; height: 100%; max-width: 800px; }
        #level-select-header { width: 100%; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        #level-select-grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; }
        .level-btn { background-color: rgba(44, 44, 52, 0.5); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); border: 1px solid var(--color-surface-light); color: var(--color-text); font-weight: bold; cursor: pointer; transition: all 0.2s ease-out; border-radius: 0; clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; min-height: 140px; }
        .level-btn:hover { background-color: var(--color-surface); border-color: var(--color-primary); color: var(--color-primary); transform: translateY(-5px) scale(1.03); box-shadow: 0 0 15px rgba(0, 246, 255, 0.4); }
        .level-btn.locked { background-color: var(--color-surface); border-color: var(--color-disabled-bg); color: var(--color-disabled-text); cursor: not-allowed; opacity: 0.6; }
        .level-btn.locked:hover { transform: none; box-shadow: none; }
        .level-title { font-size: 1.2rem; }
        .level-icon { font-size: 1.5rem; font-family: var(--font-system); }
        
        #screen-game { flex-direction: column; padding: 10px; justify-content: flex-start; }
        .game-content-wrapper { display: flex; flex-direction: column; width: 100%; max-width: 700px; gap: 15px; flex-grow: 1; }
        #scroll-content { width: 100%; overflow-y: auto; }
        #action-bar { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; flex-shrink: 0; }
        #game-hud { width: 100%; z-index: 100; background-color: rgba(44, 44, 52, 0.65); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(0, 246, 255, 0.2); border-radius: 12px; padding: 8px 15px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; font-size: clamp(0.8rem, 2vw, 1rem); color: #aaa; gap: 10px; }
        #hud-left, #hud-right { display: flex; align-items: center; gap: 10px; }
        #hud-lives { display: flex; gap: 5px; font-size: 1.5rem; color: var(--color-error); }
        #hud-lives .life.lost { opacity: 0.3; }
        #hud-wins-tracker { display: flex; gap: 4px; border: 1px solid var(--color-surface-light); padding: 2px 5px; border-radius: 6px; }
        .win-dot { width: 8px; height: 8px; background-color: var(--color-disabled-text); border-radius: 3px; opacity: 0.3; }
        .win-dot.filled { opacity: 1; background-color: var(--color-primary); }
        #problem-container { display: flex; flex-direction: column; justify-content: space-between; width: 100%; flex-grow: 1; gap: 10px; }
        
        .problem-item-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding-bottom: 10px; border-bottom: 2px dashed var(--color-bg); }
        .product-card { position: relative; display: flex; flex-direction: column; align-items: center; background-color: var(--color-bg); padding: 10px; border-radius: var(--border-radius-main); gap: 5px; transition: all 0.3s; width: 90px; }
        .product-card::after { position: absolute; top: -5px; right: -5px; background-color: var(--color-error); color: var(--color-bg); padding: 3px 6px; font-size: 0.8rem; border-radius: 8px; font-weight: bold; opacity: 0; transition: opacity 0.3s; font-family: var(--font-system); }
        .product-card.free::after { content: 'GRATIS'; opacity: 1; }
        .product-card.doubled::after { content: 'x2'; opacity: 1; background-color: var(--color-primary); }
        .product-card.defective::after { content: '🚫'; opacity: 1; font-size: 1rem; padding: 2px 4px; font-family: var(--font-system); }
        .product-emoji-container { font-size: 2.8em; line-height: 1; display: flex; font-family: var(--font-system); }
        .product-price { font-weight: bold; font-size: 1.1em; white-space: nowrap; }

        #answer-display { width: 100%; max-width: 350px; height: 55px; font-size: 2.5rem; font-weight: bold; letter-spacing: 5px; color: var(--color-primary); display: flex; align-items: center; justify-content: center; }
        
        #numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 350px;}
        #numpad-grid .key { height: 55px; font-size: 2rem; font-weight: 600; color: var(--color-text); background-color: var(--color-surface); background-image: linear-gradient(to top, rgba(0,0,0,0.2), rgba(255,255,255,0.1)); border-radius: 8px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.1); transition: all 0.15s ease-out; }
        #numpad-grid .key:hover { background-color: var(--color-surface-light); transform: translateY(-3px); box-shadow: 0 7px 10px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.2); }
        #numpad-grid .key:active { transform: translateY(1px); background-color: var(--color-bg); box-shadow: inset 0 3px 5px rgba(0,0,0,0.5); }
        #numpad-enter:not(.disabled) { background-color: var(--color-primary) !important; }
        #numpad-enter:not(.disabled) svg { fill: var(--color-bg); }
        
        #screen-result .screen-content-wrapper { height: 100%; justify-content: center; }
        
        #result-explanation { font-size: 1.1em; white-space: pre-wrap; width: 100%; max-width: 600px; display: none; }
        .problem-payment, .problem-question { font-size: 1.1em; text-align: left; }
        .problem-question { font-weight: bold; }

        #coupon-indicator { display: flex; align-items: center; justify-content: center; gap: 10px; background-color: var(--color-bg); padding: 8px; border-radius: var(--border-radius-main); font-size: 1rem; color: var(--color-primary); border: 1px dashed var(--color-primary); }
        #coupon-indicator svg { width: 40px; height: auto; }
        #coupon-indicator span { font-family: var(--font-system); }

        .anomaly-emoji { font-size: 4rem; line-height: 1; margin-bottom: 15px; font-family: var(--font-system); }
        
        #anomaly-alert, #fullscreen-prompt { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(26, 26, 29, 0.95); z-index: 10000; display: none; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        #anomaly-alert-content, #fullscreen-prompt-content { border: 2px solid var(--color-error); padding: 30px; border-radius: var(--border-radius-main); box-shadow: 0 0 20px rgba(255, 0, 160, 0.3); max-width: 600px; }

        @media (min-width: 800px) {
            #screen-game { justify-content: center; align-items: center; padding: 20px; flex-direction: column; gap: 20px; }
            #game-hud { position: relative; width: 100%; max-width: 1000px; }
            .game-content-wrapper { flex-direction: row; align-items: stretch; width: 100%; max-width: 1000px; height: 75vh; max-height: 550px; flex-grow: 0; }
            #scroll-content { flex: 1 1 55%; height: 100%; display: flex; }
            #problem-container { height: 100%; }
            #action-bar { flex: 1 1 45%; justify-content: center; height: 100%; }
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="scanline-overlay"></div><div id="anomaly-alert"><div id="anomaly-alert-content"><h1 id="anomaly-alert-title"></h1><div id="anomaly-alert-message"></div></div></div><div id="fullscreen-prompt"><div id="fullscreen-prompt-content"><h2 class="subtitle" style="color: var(--color-text);">Para una mejor experiencia, se recomienda jugar en pantalla completa.</h2><button id="btn-gofullscreen" class="btn">REACTIVAR PANTALLA COMPLETA</button><button id="btn-continue-anyway" class="btn btn-secondary btn-small">Continuar de todos modos</button></div></div>
        <div id="screen-bios" class="screen active"><div class="screen-content-wrapper"><svg viewBox="0 0 100 100" id="bios-logo"><path d="M10 90 L20 90 L25 40 L80 40 L85 70 L60 70 L55 80 L90 80 M25 40 L30 20 L45 20 L50 40" stroke="#0F0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="35" cy="90" r="5" stroke="#0F0" stroke-width="3" fill="none"></circle><circle cx="70" cy="90" r="5" stroke="#0F0" stroke-width="3" fill="none"></circle></svg><p id="bios-text"></p></div></div>
        <div id="screen-title" class="screen"><div id="title-screen-wrapper" class="screen-content-wrapper"><div class="title-header"><h1 class="title typewriter-effect">Misión Supermercado</h1><h2 class="subtitle">Un juego de matemáticas</h2></div><div class="title-footer"><button id="btn-start" class="btn">INICIAR</button><button id="btn-sound-toggle" class="btn-icon"></button></div></div></div>
        <div id="screen-name" class="screen"><div class="screen-content-wrapper"><h2 class="subtitle typewriter-effect">Introduce tu nombre</h2><div id="name-display" class="display-panel">_</div><div id="keyboard-container"></div></div></div>
        <div id="screen-level-select" class="screen"><div class="screen-content-wrapper"><div id="level-select-header"><h2 id="level-select-greeting" class="subtitle typewriter-effect"></h2><div id="system-bar"><button id="btn-profile" class="btn-icon"></button><button id="btn-main-sound-toggle" class="btn-icon"></button><button id="btn-change-name" class="btn-icon"></button></div></div><div id="level-select-grid"></div><div id="level-select-buttons"><button id="btn-infinite-mode" class="btn">Turno del Experto ♾️</button></div></div></div>
        <div id="screen-game" class="screen"><div id="game-hud"><div id="hud-left"><span id="hud-player-name"></span><div id="hud-wins-tracker"></div></div><div id="hud-right"><div id="hud-lives"></div><div id="hud-shield"></div><span id="hud-streak"></span><span id="hud-difficulty"></span></div></div><div class="game-content-wrapper"><div id="scroll-content"><div id="problem-container" class="display-panel"></div></div><div id="action-bar"><div id="answer-display" class="display-panel">_</div><div id="numpad-grid"></div></div></div></div>
        <div id="screen-result" class="screen"><div class="screen-content-wrapper"><svg id="result-icon" viewBox="0 0 100 100"></svg><h1 id="result-title" class="title typewriter-effect"></h1><p id="unlock-message"></p><p id="result-explanation" class="display-panel"></p><button id="btn-next-mission" class="btn"></button></div></div>
        <div id="screen-profile" class="screen"><div class="screen-content-wrapper"><h1 class="title typewriter-effect">Progreso del Jugador</h1><h2 id="profile-player-name" class="subtitle"></h2><div id="profile-stats"><div><div class="stat-value"><span id="profile-total-stars">0</span>/30</div><div>Estrellas</div></div><div><div class="stat-value"><span id="profile-mastered-levels">0</span>/10</div><div>Niveles Dominados</div></div></div><div id="arsenal-section"><div id="color-palette-group" class="arsenal-group" style="display: none;"><h3 class="arsenal-title">Paleta de Colores</h3><div id="color-options" class="arsenal-options"></div></div><div id="numpad-style-group" class="arsenal-group" style="display: none;"><h3 class="arsenal-title">Diseño de Teclado</h3><div id="numpad-options" class="arsenal-options"></div></div></div><button id="btn-back-to-levels" class="btn">Volver a Niveles</button><button id="btn-reset-progress" class="btn btn-danger btn-small">Reiniciar Progreso</button></div></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const WINS_TO_MASTER = 12;
            const LIVES_PER_LEVEL = 3;
            const SAVE_KEY = 'missionSupermarketSaveData_v3_0';
            const ANOMALY_BASE_CHANCE = 0.25;
            const ANOMALY_CHANCE_INCREASE = 0.10;
            let activeScreenId = 'screen-bios';
            
            const appState = { 
                playerName: '', isShiftActive: false, isSoundEnabled: true, gameMode: 'campaign', currentLevelIndex: null, currentAttempts: 1, infiniteStreak: 0, currentAnomaly: null, anomalyChance: ANOMALY_BASE_CHANCE,
                preferences: { theme: 'cyan', numpadStyle: 'standard' },
                levels: Array(10).fill(null).map((_, i) => ({ unlocked: i === 0, wins: 0, stars: 0, livesLeft: LIVES_PER_LEVEL, shields: 0 })),
                sessionPriceList: {},
                currentProblem: null
            };

            let DOM;

            function createCouponIcon(value) {
                const textSize = value >= 10 ? 11 : 14;
                return `<svg viewBox="0 0 32 20" style="fill: var(--color-primary);"><path d="M29,0H3A3,3,0,0,0,0,3V6H32V3A3,3,0,0,0,29,0Z" transform="translate(0 14)"/><path d="M32,9V3a3,3,0,0,0-3-3H3A3,3,0,0,0,0,3V9ZM16,3a1,1,0,1,1-1,1A1,1,0,0,1,16,3Z"/><g style="isolation: isolate"><rect x="1" y="7" width="30" height="12" style="fill: var(--color-error); mix-blend-mode: multiply;"/><text x="16" y="15.5" font-family="var(--font-main)" font-size="${textSize}px" font-weight="bold" fill="var(--color-bg)" text-anchor="middle" dominant-baseline="middle">-${value}</text></g></svg>`;
            }

            const ICONS = { SHIFT: `<svg class="key-icon" viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>`, BACKSPACE: `<svg class="key-icon" viewBox="0 0 24 24"><path d="M22 3H7c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-4.79 13.21L15.5 14.5l-2.29-2.29L10.92 14.5 9.5 13.08l2.29-2.29L9.5 8.5l1.42-1.42 2.29 2.29L15.5 7.08l1.42 1.42-2.29 2.29L17.21 13.08l-1.42 1.42z"/></svg>`, CHECK: `<svg class="key-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>`, CLEAR: `<svg class="key-icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>`, PROFILE: `<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`, ENTER: `<svg class="key-icon" viewBox="0 0 24 24"><path d="M19 7v4H5.83l3.58-3.59L8 6l-6 6 6 6 1.41-1.41L5.83 13H21V7z"/></svg>`, SOUND_ON: `<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`, SOUND_OFF: `<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`, SWITCH_PLAYER: `<svg viewBox="0 0 24 24"><path d="M16 17v-3H9v-4h7V7l5 5-5 5zM14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>` };

                generateItems() { let config, availableProducts; if (appState.gameMode === 'infinite') { config = LEVEL_CONFIG[getRandomInt(0, LEVEL_CONFIG.length - 1)]; const allProducts = Object.values(THEMED_PRODUCTS).flat(); availableProducts = [...allProducts]; } else { config = LEVEL_CONFIG[appState.currentLevelIndex]; const theme = LEVEL_THEMES[appState.currentLevelIndex] || 'all'; if (theme !== 'all' && THEMED_PRODUCTS[theme]) { availableProducts = [...THEMED_PRODUCTS[theme]]; } else { const allProducts = Object.values(THEMED_PRODUCTS).flat(); availableProducts = [...allProducts]; } } let numItems = getRandomInt(config.minItems, config.maxItems); let selectedProducts = []; for (let i = 0; i < numItems; i++) { let productIndex = getRandomInt(0, availableProducts.length - 1); selectedProducts.push(JSON.parse(JSON.stringify(availableProducts[productIndex]))); } return selectedProducts.map(product => { const price = appState.sessionPriceList[product.name]; product.price = price; product.totalPrice = price; return product; }).sort((a, b) => b.price - a.price); },
                generatePaymentAndQuestion(totalCost) { const config = (appState.gameMode === 'infinite') ? LEVEL_CONFIG[getRandomInt(0, LEVEL_CONFIG.length - 1)] : LEVEL_CONFIG[appState.currentLevelIndex]; const scenario = config.scenarios[getRandomInt(0, config.scenarios.length - 1)]; const bills = [10, 20, 50, 100, 200]; let payment = 0, paymentText = '', change = 0, questionText = ''; if (scenario === 'total_cost' || totalCost < 5) { payment = totalCost; change = totalCost; questionText = '¿Cuánto debes pagar en total?'; } else { let initialPayment = 0; if (scenario === 'single_bill') { initialPayment = bills.find(b => b > totalCost) || (Math.ceil(totalCost / 10) * 10); } else if (scenario === 'multi_bill') { let baseBill = [10, 20, 5].find(b => b * 2 > totalCost) || 10; initialPayment = baseBill * 2; } payment = initialPayment; while (payment <= totalCost) { payment = (bills.find(b => b > payment) || payment + 10); } change = payment - totalCost; questionText = '¿Cuánto cambio deben darte?'; if (scenario === 'multi_bill' && payment % 2 === 0 && payment > 20) { paymentText = `Pagas con dos billetes de ${payment/2} Bs.`; } else { paymentText = `Pagas con un billete de ${payment} Bs.`; } } const titles = ["🛒 Tu Ticket de Compra:", "📋 Misión de Compras:", "📝 Lista del Supermercado:"]; return { payment, paymentText, change, questionText, titleText: titles[getRandomInt(0, titles.length - 1)], scenario }; },
                checkAnswer() { const isCorrect = parseInt(appState.userAnswer) === appState.currentProblem.answer; if (isCorrect) this.handleCorrectAnswer(); else { const level = appState.gameMode === 'campaign' ? appState.levels[appState.currentLevelIndex] : null; if (appState.gameMode === 'campaign' && ((level.shields > 0) || (level.livesLeft <= 1))) this.handleIncorrectAnswer(false); else this.handleIncorrectAnswer(true); } },
                handleCorrectAnswer() { AudioManager.playSound('success'); if (appState.gameMode === 'infinite') { appState.infiniteStreak++; this.startInfiniteMode(); return; } const level = appState.levels[appState.currentLevelIndex]; const oldWins = level.wins; level.wins++; let earnedStar = false, earnedShield = false; [4, 8, 12].forEach((winsNeeded, index) => { if(oldWins < winsNeeded && level.wins >= winsNeeded && level.stars < (index + 1)) { level.stars = index + 1; earnedStar = true; } }); if([4, 8].includes(level.wins)) { level.shields = (level.shields || 0) + 1; earnedShield = true; } saveState(); DOM.resultScreen.className = `screen active success`; DOM.resultIcon.innerHTML = RESULT_ICONS.success; UIManager.triggerAnimation(DOM.resultIcon, 'pop-in'); DOM.resultExplanation.style.display = 'block'; DOM.resultTitle.textContent = '¡CORRECTO!'; DOM.resultExplanation.textContent = appState.currentProblem.explanation; let unlockMsgText = ''; if (earnedStar) unlockMsgText += `⭐ ¡ESTRELLA GANADA! ⭐\n`; if (earnedShield) unlockMsgText += `🛡️ ¡VELO DE SEGURIDAD OBTENIDO! 🛡️\n`; const isMastered = level.stars === 3; if (isMastered && appState.currentLevelIndex < appState.levels.length - 1) { const nextLevel = appState.levels[appState.currentLevelIndex + 1]; if (!nextLevel.unlocked) { nextLevel.unlocked = true; unlockMsgText += `🏆 ¡NIVEL ${appState.currentLevelIndex + 2} DESBLOQUEADO! 🏆`; saveState(); } } DOM.unlockMessage.textContent = unlockMsgText; if(unlockMsgText) UIManager.triggerAnimation(DOM.unlockMessage, 'pop-in'); if (isMastered) { DOM.btnNextMission.textContent = 'Ir a Niveles'; DOM.btnNextMission.onclick = () => { UIManager.renderLevelSelect(); UIManager.goToScreen('screen-level-select'); }; } else { DOM.btnNextMission.textContent = 'Siguiente Misión'; DOM.btnNextMission.onclick = () => this.startNewMission(appState.currentLevelIndex); } UIManager.goToScreen('screen-result'); },
                handleIncorrectAnswer(isInstant = false) { AudioManager.playSound('error'); if(appState.gameMode === 'infinite'){ this.handleInfiniteFailure(); return; } const level = appState.levels[appState.currentLevelIndex]; appState.currentAttempts++; let shieldWasUsed = false; if (level.shields > 0) { level.shields--; shieldWasUsed = true; } else { level.livesLeft--; } this.updateHUD(); saveState(); if(isInstant && !shieldWasUsed) { UIManager.triggerAnimation(DOM.answerDisplay, 'answer-error-flash'); appState.userAnswer = ''; setTimeout(() => UIManager.updateAnswerDisplay(), 400); return; } document.querySelectorAll('.typewriter-effect').forEach(el => el.removeAttribute('data-typed')); UIManager.goToScreen('screen-result'); DOM.resultScreen.className = `screen active failure`; DOM.resultIcon.innerHTML = RESULT_ICONS.failure; UIManager.triggerAnimation(DOM.resultIcon, 'pop-in'); DOM.resultExplanation.textContent = appState.currentProblem.explanation; DOM.resultExplanation.style.display = 'block'; if (shieldWasUsed) { DOM.resultTitle.textContent = '¡ESCUDO ACTIVADO!'; DOM.unlockMessage.textContent = 'Tu Velo de Seguridad absorbió el fallo. ¡No perdiste una vida!'; DOM.btnNextMission.textContent = 'Siguiente Misión'; DOM.btnNextMission.onclick = () => { this.startNewMission(appState.currentLevelIndex); }; return; } if (level.livesLeft > 0) { DOM.resultTitle.textContent = 'CASI...'; DOM.unlockMessage.textContent = `Te quedan ${level.livesLeft} ${level.livesLeft === 1 ? 'vida' : 'vidas'} para este nivel.`; DOM.btnNextMission.textContent = 'Siguiente Misión'; DOM.btnNextMission.onclick = () => { this.startNewMission(appState.currentLevelIndex); }; } else { level.wins = 0; level.livesLeft = LIVES_PER_LEVEL; level.shields = 0; saveState(); DOM.resultTitle.textContent = 'MISIÓN FALLIDA'; DOM.unlockMessage.textContent = 'Has agotado todas tus vidas.\nEl progreso de victorias para este nivel ha sido reiniciado. ¡Pero no te rindas!'; DOM.btnNextMission.textContent = 'Volver a Niveles'; DOM.btnNextMission.onclick = () => { UIManager.renderLevelSelect(); UIManager.goToScreen('screen-level-select'); }; } },
                handleInfiniteFailure(){ DOM.resultScreen.className = `screen active failure`; DOM.resultIcon.innerHTML = RESULT_ICONS.failure; UIManager.triggerAnimation(DOM.resultIcon, 'pop-in'); DOM.resultExplanation.textContent = appState.currentProblem.explanation; DOM.resultExplanation.style.display = 'block'; DOM.resultTitle.textContent = 'RACHA TERMINADA'; DOM.unlockMessage.textContent = `Lograste una racha de ${appState.infiniteStreak}!`; DOM.btnNextMission.textContent = 'Volver al Menú'; DOM.btnNextMission.onclick = () => { UIManager.renderLevelSelect(); UIManager.goToScreen('screen-level-select'); }; }
            };
            const VirtualKeyboard = {
                init() { const keyLayout = { top: ['q','w','e','r','t','y','u','i','o','p'], middle: ['a','s','d','f','g','h','j','k','l','ñ'], bottom: ['SHIFT','z','x','c','v','b','n','m','BACKSPACE','✓'] }; DOM.keyboardContainer.innerHTML = ''; for (const row in keyLayout) { const rEl = document.createElement('div'); rEl.className = 'keyboard-row'; keyLayout[row].forEach(key => { const kEl = document.createElement('div'); kEl.className = 'key'; kEl.dataset.key = key; if (key.length > 1) { kEl.classList.add('function'); kEl.innerHTML = ICONS[key]; } else { kEl.textContent = key; } if(key === '✓'){ kEl.id = 'name-confirm-key'; kEl.classList.add('disabled'); } rEl.appendChild(kEl); }); DOM.keyboardContainer.appendChild(rEl); } },
                handleKeyPress(key) { AudioManager.playSound('click'); if (key === '✓') { if(appState.playerName.length > 0) { saveState(); DOM.levelSelectGreeting.textContent = `¡Hola, ${appState.playerName}!`; UIManager.renderLevelSelect(); UIManager.goToScreen('screen-level-select'); } return; } if (key === 'BACKSPACE') appState.playerName = appState.playerName.slice(0, -1); else if (key === 'SHIFT') this.toggleShift(); else if (appState.playerName.length < 15) { const char = appState.isShiftActive ? key.toUpperCase() : key.toLowerCase(); appState.playerName += char; if (appState.isShiftActive) this.toggleShift(); } UIManager.updateNameDisplay(); }

            function setupEventListeners() { DOM.btnStart.addEventListener('click', () => { AudioManager.init(); AudioManager.playSound('click'); requestFullscreen(DOM.appContainer); if (appState.playerName) { DOM.levelSelectGreeting.textContent = `¡Bienvenido de nuevo, ${appState.playerName}!`; UIManager.renderLevelSelect(); UIManager.goToScreen('screen-level-select'); } else { UIManager.goToScreen('screen-name'); } }); DOM.btnChangeName.addEventListener('click', () => { AudioManager.playSound('click'); if (window.confirm("¿Estás seguro? Cambiar tu nombre reiniciará TODO tu progreso (niveles y estrellas). Esta acción es irreversible.")) { localStorage.removeItem(SAVE_KEY); location.reload(); } }); DOM.btnResetProgress.addEventListener('click', () => { AudioManager.playSound('click'); if (window.confirm("¿Estás seguro de que quieres reiniciar TODO tu progreso? Esta acción no se puede deshacer.")) { localStorage.removeItem(SAVE_KEY); location.reload(); } }); DOM.keyboardContainer.addEventListener('click', (e) => { const keyEl = e.target.closest('.key'); if (keyEl) VirtualKeyboard.handleKeyPress(keyEl.dataset.key); }); DOM.levelSelectGrid.addEventListener('click', (e) => { const btn = e.target.closest('.level-btn'); if (btn && !btn.disabled) { AudioManager.playSound('click'); GameManager.startNewMission(parseInt(btn.dataset.levelIndex)); } }); DOM.numpadGrid.addEventListener('click', (e) => { const keyEl = e.target.closest('.key'); if (keyEl) Numpad.handleKeyPress(keyEl.dataset.key); }); DOM.btnProfile.addEventListener('click', () => { AudioManager.playSound('click'); UIManager.renderProfile(); UIManager.goToScreen('screen-profile'); }); DOM.btnBackToLevels.addEventListener('click', () => { AudioManager.playSound('click'); UIManager.goToScreen('screen-level-select'); }); DOM.btnInfiniteMode.addEventListener('click', () => { AudioManager.playSound('click'); GameManager.startInfiniteMode(); }); DOM.titleSoundToggle.addEventListener('click', () => { AudioManager.toggleMute(!appState.isSoundEnabled); AudioManager.playSound('click'); }); DOM.mainSoundToggle.addEventListener('click', () => { AudioManager.toggleMute(!appState.isSoundEnabled); AudioManager.playSound('click'); }); document.addEventListener('keydown', handlePhysicalKeyboard); document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && activeScreenId !== 'screen-title' && activeScreenId !== 'screen-bios') DOM.fullscreenPrompt.style.display = 'flex'; }); DOM.btnGoFullscreen.addEventListener('click', () => { requestFullscreen(DOM.appContainer); DOM.fullscreenPrompt.style.display = 'none'; }); DOM.btnContinueAnyway.addEventListener('click', () => { DOM.fullscreenPrompt.style.display = 'none'; }); DOM.colorOptions.addEventListener('click', (e) => { const btn = e.target.closest('.arsenal-btn'); if(btn) { appState.preferences.theme = btn.dataset.theme; UIManager.applyPreferences(); UIManager.renderProfile(); saveState(); } }); DOM.numpadOptions.addEventListener('click', (e) => { const btn = e.target.closest('.arsenal-btn'); if(btn) { appState.preferences.numpadStyle = btn.dataset.style; UIManager.applyPreferences(); UIManager.renderProfile(); saveState(); } }); }
            function handlePhysicalKeyboard(e) { if (activeScreenId === 'screen-name') { e.preventDefault(); if (e.key.match(/^[a-zA-ZñÑ]$/)) { const key = e.key.toLowerCase(); if (e.shiftKey !== appState.isShiftActive) VirtualKeyboard.toggleShift(); VirtualKeyboard.handleKeyPress(key); flashKeyFeedback(`#keyboard-container .key[data-key="${key}"]`); } else if (e.key === 'Backspace') { VirtualKeyboard.handleKeyPress('BACKSPACE'); flashKeyFeedback(`#keyboard-container .key[data-key="BACKSPACE"]`); } else if (e.key === 'Enter') { VirtualKeyboard.handleKeyPress('✓'); flashKeyFeedback('#name-confirm-key'); } } else if (activeScreenId === 'screen-game') { e.preventDefault(); if (e.key.match(/^[0-9]$/)) { Numpad.handleKeyPress(e.key); flashKeyFeedback(`#numpad-grid .key[data-key="${e.key}"]`); } else if (e.key === 'Backspace' || e.key.toLowerCase() === 'c') { Numpad.handleKeyPress('C'); flashKeyFeedback(`#numpad-grid .key[data-key="C"]`); } else if (e.key === 'Enter') { Numpad.handleKeyPress('ENTER'); flashKeyFeedback('#numpad-enter'); } } }

mentById('anomaly-alert-message'), titleSoundToggle: document.getElementById('btn-sound-toggle'), mainSoundToggle: document.getElementById('btn-main-sound-toggle'), fullscreenPrompt: document.getElementById('fullscreen-prompt'), btnGoFullscreen: document.getElementById('btn-gofullscreen'), btnContinueAnyway: document.getElementById('btn-continue-anyway'), arsenalSection: document.getElementById('arsenal-section'), colorPaletteGroup: document.getElementById('color-palette-group'), colorOptions: document.getElementById('color-options'), numpadStyleGroup: document.getElementById('numpad-style-group'), numpadOptions: document.getElementById('numpad-options'), };
